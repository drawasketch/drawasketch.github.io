<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us – Draw A Sketch</title>
  <meta name="description" content="Have feedback or drawing tool requests? Contact Shelly, the developer behind Draw A Sketch directly via email."/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://drawasketch.github.io/contact"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png"> 

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet"/>

  <style>
    /* ── Reset & Variables ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink:    #FF6B9D;
      --purple:  #A855F7;
      --cyan:    #06B6D4;
      --white:   #FFFFFF;
      --off-white: #FFF9F0;
      --text-dark: #1A1025;
      --text-mid:  #4A3F5C;
      --text-light:#7B6B8C;
      --border:    rgba(168,85,247,0.15);
      --grad-hero: linear-gradient(135deg,#FFF0FB 0%,#F0E8FF 40%,#E8F8FF 80%,#FFFBF0 100%);
      --grad-accent: linear-gradient(135deg,#FF6B9D,#A855F7,#06B6D4);
      --radius-md: 18px;
      --radius-lg: 28px;
      --shadow-lg: 0 20px 60px rgba(168,85,247,0.22);
    }

    body { font-family: 'Nunito', sans-serif; background: var(--off-white); color: var(--text-dark); line-height: 1.7; }
    #site-header { height: 68px; background: rgba(255,249,240,0.88); border-bottom: 1.5px solid var(--border); }
    
    main { padding: 80px clamp(1rem,5vw,3rem); background: var(--grad-hero); min-height: calc(100vh - 68px); display: flex; align-items: center; }
    .contact-container { max-width: 650px; margin: 0 auto; background: var(--white); padding: clamp(2rem,6vw,3.5rem); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1.5px solid rgba(168,85,247,0.18); text-align: center; }
    
    .section-tag { display: inline-flex; background: rgba(6,182,212,.1); color: var(--cyan); border: 1.5px solid rgba(6,182,212,.25); border-radius: 50px; padding: .3rem .9rem; font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 1rem; }
    h1 { font-weight: 900; font-size: clamp(2rem,4vw,2.6rem); line-height: 1.2; margin-bottom: 0.75rem; }
    .gradient-text { background: var(--grad-accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    p { color: var(--text-mid); margin-bottom: 2rem; font-size: 1.05rem; }
    
    /* ── Mail Button Card ────────────────────────────────────── */
    .mail-card { display: inline-flex; align-items: center; gap: .75rem; background: var(--off-white); border: 2px dashed var(--purple); padding: 1rem 2rem; border-radius: var(--radius-md); text-decoration: none; color: var(--text-dark); font-weight: 800; font-size: clamp(1rem,3vw,1.3rem); transition: transform .2s, box-shadow .2s; }
    .mail-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(168,85,247,0.15); }
    .mail-icon { font-size: 1.6rem; }
  </style>
</head>
<body>

<!-- Header injected by header.js -->

<main id="main-content">
  <div class="contact-container">
    <div class="section-tag">Get In Touch</div>
    <h1>Let's Connect <span class="gradient-text">Art &amp; Code</span></h1>
    <p>Have feature update requests for the sketchpad tools, technical bug insights, or interesting SEO collaboration ideas? Drop me an email directly and I'll do my best to get back to you soon!</p>
    
    <a href="mailto:nikedino121@gmail.com" class="mail-card">
      <span class="mail-icon">📩</span>
      <span>nikedino121@gmail.com</span>
    </a>
  </div>
</main>

<!-- Footer injected by footer.js -->

<script src="header.js"></script>
<script src="footer.js"></script>
</body>
</html>
